# Render 배포 설정 (Blueprint). Render 대시보드 → New → Blueprint → 이 저장소 선택.
# sync: false 인 값은 Render 화면에서 직접 입력합니다. (키·주소는 저장소에 넣지 않음)
services:
  - type: web
    name: changewatch-api
    runtime: python
    plan: free
    rootDir: backend
    branch: develop # 개발 중에는 develop을 배포해 휴대폰 테스트, 최종 시연 전 main으로 변경
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL # Neon 접속 주소
        sync: false
      - key: CORS_ORIGINS # Vercel 배포 주소 (예: https://changewatch.vercel.app)
        sync: false
      - key: CORS_ORIGIN_REGEX # 선택: Vercel 미리보기 주소용
        sync: false
